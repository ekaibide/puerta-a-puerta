<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analizador de registros</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1626;--card:#13233b;--ink:#eaf2ff;--mut:#9fb3cf;--ok:#2fbf71;--bad:#ff4d5e;--warn:#ffc83d;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;padding:16px;line-height:1.45}
main{max-width:1100px;margin:auto}
h1{font-size:28px;font-weight:900}h2{font-size:20px;font-weight:900;margin:22px 0 10px}
p.m{color:var(--mut);font-weight:700}
#drop{border:3px dashed var(--line);border-radius:18px;padding:30px;text-align:center;font-weight:800;margin:16px 0;cursor:pointer}
#drop.on{border-color:var(--warn);background:rgba(255,200,61,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
.card b.big{font-size:28px;display:block}
.card small{color:var(--mut);font-weight:800}
table{width:100%;border-collapse:collapse;font-weight:700;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:13px;text-transform:uppercase}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:900}
.ok{background:rgba(47,191,113,.2);color:#7ff0b0}.bad{background:rgba(255,77,94,.2);color:#ff9aa4}.warn{background:rgba(255,200,61,.2);color:#ffe08a}
canvas{width:100%;height:160px;display:block}
button{font:900 17px Nunito;border:0;border-radius:12px;padding:12px 20px;background:var(--ok);color:#06210f;cursor:pointer;margin-top:12px}
button:disabled{opacity:.4;cursor:not-allowed}
.note{background:rgba(255,200,61,.1);border:1px solid rgba(255,200,61,.4);border-radius:12px;padding:10px 14px;font-weight:700;margin:10px 0}
</style>
</head>
<body><main>
<h1>📊 Analizador de registros · Puerta a Puerta</h1>
<p class="m">Arrastra aquí el archivo <b>puerta-a-puerta-registros-AAAA-MM-DD.json</b> que exporta el juego. Todo se procesa en este navegador: no se sube a ningún sitio.</p>
<div id="drop">📂 Suelta el JSON aquí o pulsa para elegirlo<input type="file" id="file" accept=".json,application/json" hidden></div>
<div id="out"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const FLEXT={verde:.45,azul:.6,roja:.7};
const DEF={flexScale:1,shoulderDeg:8,handsMin:.5,stanceMin:.55,stanceMax:1.5};
const pct=(a,p)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.max(0,Math.floor(p*(s.length-1))))]};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f2=v=>v==null?'—':(+v).toFixed(2);
const drop=$('#drop');
drop.onclick=()=>$('#file').click();
$('#file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
async function load(f){
 let j;try{j=JSON.parse(await f.text())}catch(e){$('#out').innerHTML='<div class="note">Ese archivo no es JSON válido.</div>';return}
 const runs=(j.runs||j).filter(r=>r&&r.frames);analyze(runs,j.profile);
}
function col(run,name){return run.cols?run.cols.indexOf(name):-1}
function analyze(runs,profile){
 const cam=runs.filter(r=>r.mode==='cam');
 const cur={...DEF,...(profile&&profile.thr||{})};
 // --- detección y resumen
 let fr=0,trk=0;for(const r of cam){const i=col(r,'tracked');for(const f of r.frames){fr++;if(f[i])trk++}}
 const gates=cam.flatMap(r=>(r.gates||[]).map(g=>({...g,course:r.course,run:r})));
 // --- valores por fotograma (sólo cámara y con seguimiento)
 const V={flex:[],shDeg:[],hands:[],stance:[]};const good={flex:[],shDeg:[],hands:[],stance:[]};
 for(const r of cam){
  const I={t:col(r,'t'),vx:col(r,'vx'),flex:col(r,'flex'),sh:col(r,'shDeg'),hands:col(r,'hands'),st:col(r,'stance'),trk:col(r,'tracked')};
  const ft=FLEXT[r.course]||.6;
  const gs=(r.gates||[]).filter(g=>g.inside);const ratings=gs.map(g=>g.rating).sort((a,b)=>b-a);const cut=ratings[Math.floor(ratings.length/3)]??1;
  const goodWin=[];let prevT=0;for(const g of (r.gates||[])){if(g.inside&&g.rating>=cut)goodWin.push([prevT,g.t]);prevT=g.t}
  for(const f of r.frames){
   if(I.trk>=0&&!f[I.trk])continue;
   const isGood=goodWin.some(([a,b])=>f[I.t]>a&&f[I.t]<=b);
   const push=(k,v)=>{if(v==null||isNaN(v))return;V[k].push(v);if(isGood)good[k].push(v)};
   if(I.flex>=0)push('flex',f[I.flex]/(ft*.6));            // flexión relativa a su umbral (1 = umbral actual)
   if(I.sh>=0&&I.vx>=0&&Math.abs(f[I.vx])>3)push('shDeg',f[I.sh]); // hombros sólo girando
   if(I.hands>=0)push('hands',f[I.hands]);
   if(I.st>=0&&f[I.st]!=null)push('stance',f[I.st]);
  }
 }
 // --- regla de recalibración (Fable #15)
 const enough=cam.length>=8&&gates.length>=150;
 const lim=(old,nw)=>Math.max(old*.85,Math.min(old*1.15,nw));
 const redFrac=(arr,bad)=>arr.length?arr.filter(bad).length/arr.length:null;
 const M=[
  {k:'flexScale',name:'Flexión (mín.)',data:V.flex,curT:cur.flexScale,sug:pct(good.flex,.2),bad:(v,t)=>v<t,unit:'× umbral'},
  {k:'shoulderDeg',name:'Hombros planos (máx. °)',data:V.shDeg,curT:cur.shoulderDeg,sug:pct(good.shDeg,.8),bad:(v,t)=>v>t,unit:'°'},
  {k:'handsMin',name:'Manos delante (mín.)',data:V.hands,curT:cur.handsMin,sug:pct(good.hands,.2),bad:(v,t)=>v<t,unit:''},
  {k:'stanceMin',name:'Pies (mín.)',data:V.stance,curT:cur.stanceMin,sug:pct(good.stance,.1),bad:(v,t)=>v<t,unit:''},
  {k:'stanceMax',name:'Pies (máx.)',data:V.stance,curT:cur.stanceMax,sug:pct(good.stance,.9),bad:(v,t)=>v>t,unit:''}
 ];
 const prof={};
 for(const m of M){
  m.redNow=redFrac(m.data,v=>m.bad(v,m.curT));
  m.state=m.redNow==null?'sin datos':m.redNow>.4?'rota':m.redNow<.03?'trivial':m.redNow<.1||m.redNow>.3?'fuera de banda':'bien';
  m.newT=m.sug==null?m.curT:lim(m.curT,m.sug);
  m.redNew=redFrac(m.data,v=>m.bad(v,m.newT));
  prof[m.k]=enough&&m.sug!=null&&m.state!=='rota'?+m.newT.toFixed(3):m.curT;
 }
 // --- izquierda / derecha
 const side=d=>{const g=gates.filter(x=>x.dir===d);return g.length?{n:g.length,r:mean(g.map(x=>x.rating)),miss:g.filter(x=>!x.inside).length}:null};
 const L=side(-1),R=side(1);
 // --- salida
 const tag=s=>`<span class="tag ${s==='bien'?'ok':s==='rota'?'bad':'warn'}">${s}</span>`;
 $('#out').innerHTML=`
 <div class="grid">
  <div class="card"><small>Bajadas con cámara</small><b class="big">${cam.length}</b><small>${runs.length-cam.length} con teclado (no cuentan)</small></div>
  <div class="card"><small>Puertas analizadas</small><b class="big">${gates.length}</b></div>
  <div class="card"><small>Fotogramas con el cuerpo detectado</small><b class="big">${fr?Math.round(trk/fr*100):0} %</b><small>${fr<1?'':trk/fr<.9?'Baja: revisa luz y encuadre':'Correcto'}</small></div>
  <div class="card"><small>Izquierda · Derecha</small><b class="big">${L?Math.round(L.r*100):'—'} · ${R?Math.round(R.r*100):'—'}</b><small>${L&&R?`${L.miss} y ${R.miss} puertas falladas`:''}</small></div>
 </div>
 <h2>Umbrales</h2>
 ${enough?'':`<div class="note">Hacen falta al menos <b>8 bajadas con cámara y 150 puertas</b> para proponer cambios (ahora: ${cam.length} y ${gates.length}). Te enseño los datos, pero el perfil exportado mantiene los umbrales actuales.</div>`}
 <table><tr><th>Métrica</th><th>Actual</th><th>% en rojo</th><th>Estado</th><th>Propuesta (±15 % máx.)</th><th>% en rojo con la propuesta</th></tr>
 ${M.map(m=>`<tr><td>${m.name}</td><td>${f2(m.curT)} ${m.unit}</td><td>${m.redNow==null?'—':Math.round(m.redNow*100)+' %'}</td><td>${tag(m.state)}</td><td>${f2(m.newT)} ${m.unit}</td><td>${m.redNew==null?'—':Math.round(m.redNew*100)+' %'}</td></tr>`).join('')}
 </table>
 <p class="m" style="margin-top:8px">Objetivo: 10–30 % del tiempo en rojo. Más del 40 % = la medida está rota (no se ajusta, se revisa). Menos del 3 % = es demasiado fácil. La propuesta usa el percentil 20 de sus puertas buenas (tercio superior de nota).</p>
 <h2>Distribuciones</h2>
 <div class="grid">${M.filter(m=>m.k!=='stanceMax').map((m,i)=>`<div class="card"><small>${m.name}</small><canvas id="h${i}"></canvas></div>`).join('')}</div>
 <h2>Tiempo en rojo por bajada</h2>
 <table><tr><th>Fecha</th><th>Pista</th><th>Tiempo</th><th>Puertas</th><th>Foco</th><th>% foco bien</th><th>Segundos en rojo</th></tr>
 ${cam.map(r=>{const re=r.result||{};return `<tr><td>${(r.date||'').slice(0,16).replace('T',' ')}</td><td>${r.course}</td><td>${f2(re.time)} s</td><td>${re.gatesOk}/${re.gatesTotal}</td><td>${r.focus||'—'}</td><td>${re.focusRate!=null?Math.round(re.focusRate*100)+' %':'—'}</td><td>${Object.entries(re.secondsInRed||{}).map(([k,v])=>`${k} ${(+v).toFixed(0)}`).join(' · ')}</td></tr>`}).join('')}
 </table>
 <button id="exp" ${enough?'':'disabled'}>💾 Exportar perfil para el juego</button>
 <p class="m">En el juego: menú → 📂 Importar perfil.</p>`;
 M.filter(m=>m.k!=='stanceMax').forEach((m,i)=>hist($('#h'+i),m.data,[m.curT,m.newT,m.k==='stanceMin'?cur.stanceMax:null,m.k==='stanceMin'?M[4].newT:null]));
 const b=$('#exp');if(b)b.onclick=()=>{const blob=new Blob([JSON.stringify({app:'puerta-a-puerta-perfil',date:new Date().toISOString(),runs:cam.length,gates:gates.length,thr:prof},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='perfil-umbrales.json';a.click()};
}
function hist(cv,data,lines){
 const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;const c=cv.getContext('2d');c.scale(d,d);
 if(!data.length){c.fillStyle='#9fb3cf';c.font='800 14px Nunito';c.fillText('Sin datos',10,24);return}
 const lo=pct(data,.01),hi=pct(data,.99),span=Math.max(1e-6,hi-lo),B=30,bins=Array(B).fill(0);
 for(const v of data){const i=Math.min(B-1,Math.max(0,Math.floor((v-lo)/span*B)));bins[i]++}
 const mx=Math.max(...bins);
 bins.forEach((n,i)=>{c.fillStyle='#4c9bff';const bh=n/mx*(h-26);c.fillRect(i*w/B+1,h-18-bh,w/B-2,bh)});
 c.fillStyle='#9fb3cf';c.font='700 11px Nunito';c.fillText(lo.toFixed(2),2,h-4);c.textAlign='right';c.fillText(hi.toFixed(2),w-2,h-4);
 lines.forEach((t,i)=>{if(t==null)return;const x=(t-lo)/span*w;if(x<0||x>w)return;c.strokeStyle=i%2?'#ffc83d':'#ff4d5e';c.lineWidth=2;c.setLineDash(i%2?[5,4]:[]);c.beginPath();c.moveTo(x,4);c.lineTo(x,h-18);c.stroke();c.setLineDash([])});
}
</script>
</body>
</html>
